<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Rendering...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 1080px; height: 1080px; overflow: hidden; background: #000; }
        #canvas { display: block; width: 1080px; height: 1080px; }
    </style>
</head>
<body>
    <canvas id="canvas" width="1080" height="1080"></canvas>

    <script type="module">
        import { PosterCanvasEngine } from '../public/js/creative/PosterCanvasEngine.js';
        import { mockJomConsultBrand, briefTestA, briefTestB, briefTestC } from './fixtures/jomconsult_briefs.js';

        const params = new URLSearchParams(window.location.search);
        const fixtureKey = params.get('fixture') || 'testA';

        const fixtures = {
            testA: briefTestA,
            testB: briefTestB,
            testC: briefTestC
        };

        const brief = fixtures[fixtureKey] || briefTestA;

        // Create high-res background photography texture matching archetype focal point
        function createPhoto(focalAlignment = 'right') {
            const off = document.createElement('canvas');
            off.width = 1080;
            off.height = 1080;
            const ctx = off.getContext('2d');

            // Ambient office daylight background
            const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
            bgGrad.addColorStop(0, '#FFFFFF');
            bgGrad.addColorStop(0.45, '#F8FAFC');
            bgGrad.addColorStop(1, '#F1F5F9');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1080);

            // Subtle warm daylight bokeh circles
            const bokehs = [
                { x: 300, y: 350, r: 160, c: 'rgba(255, 212, 0, 0.15)' },
                { x: 820, y: 250, r: 240, c: 'rgba(255, 212, 0, 0.12)' },
                { x: 920, y: 650, r: 190, c: 'rgba(0, 0, 0, 0.04)' },
                { x: 200, y: 800, r: 220, c: 'rgba(255, 212, 0, 0.08)' }
            ];
            bokehs.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = b.c;
                ctx.fill();
            });

            // Executive Malaysian professional figure silhouette in natural office setting
            const charX = focalAlignment === 'right' ? 780 : (focalAlignment === 'left' ? 300 : 540);
            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
            ctx.beginPath();
            ctx.ellipse(charX, 720, 180, 290, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(charX, 420, 105, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            return off;
        }

        // Brand Logo Asset
        function createLogo() {
            const off = document.createElement('canvas');
            off.width = 300;
            off.height = 64;
            const ctx = off.getContext('2d');
            
            // Brand Yellow Accent Diamond Mark
            ctx.fillStyle = '#FFD400';
            ctx.beginPath();
            ctx.moveTo(28, 8);
            ctx.lineTo(50, 32);
            ctx.lineTo(28, 56);
            ctx.lineTo(6, 32);
            ctx.closePath();
            ctx.fill();

            // Bold Black Brand Typography
            ctx.fillStyle = '#111111';
            ctx.font = '900 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText('JomConsult', 62, 43);
            return off;
        }

        async function run() {
            const canvasEl = document.getElementById('canvas');
            const engine = new PosterCanvasEngine({ canvas: canvasEl, width: 1080, height: 1080 });
            engine.setBrandProfile(mockJomConsultBrand);
            engine.setBrief(brief);

            const focal = brief.archetype === 'BEFORE_AFTER' ? 'center' : (brief.archetype === 'PROFESSION_SPECIFIC' ? 'right' : 'right');
            const photo = createPhoto(focal);
            await engine.setImageAsset(photo);

            const logo = createLogo();
            await engine.render({ logoAsset: logo });
            document.title = 'RENDER_COMPLETE';
            console.log('RENDER_COMPLETE');
        }

        run().catch(err => {
            console.error('Render failure:', err);
            document.title = 'RENDER_ERROR: ' + err.message;
        });
    </script>
</body>
</html>
