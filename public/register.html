<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SocialHub - Scheduling Platform</title>
    
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Guest Route Guard: redirects to dashboard instantly if user already authenticated -->
    <script type="module">
        import { sessionService } from './js/services/sessionService.js';
        sessionService.requireGuest();
    </script>

    <style>
        .auth-page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, var(--color-bg-base) 100%);
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            animation: authFadeIn var(--transition-normal) forwards;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-primary);
            letter-spacing: -0.025em;
        }

        .auth-subtitle {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .auth-alert {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-xs);
            font-size: 0.8125rem;
            margin-bottom: 1.25rem;
            font-weight: 500;
        }

        .auth-alert.error {
            background-color: var(--color-danger-light);
            color: var(--color-danger);
            border: 1px solid rgba(220, 53, 69, 0.15);
        }

        .auth-alert.success {
            background-color: var(--color-success-light);
            color: var(--color-success);
            border: 1px solid rgba(40, 167, 69, 0.15);
        }

        .auth-footer {
            margin-top: 1.75rem;
            text-align: center;
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
        }

        .auth-link {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-fast);
        }

        .auth-link:hover {
            color: var(--color-primary-hover);
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="auth-page-wrapper">
        <div class="card auth-card">
            
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#brandGrad)" />
                        <path d="M12 7V17M7 12H17" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                        <defs>
                            <linearGradient id="brandGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3b82f6" />
                                <stop offset="1" stop-color="#1d4ed8" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="auth-title">Create account</h1>
                <p class="auth-subtitle">Get started with a free foundation account</p>
            </div>

            <!-- Notifications Alerts Box -->
            <div class="auth-alert" id="authAlertBox"></div>

            <!-- Registration Form -->
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="regName">Full Name</label>
                    <input type="text" id="regName" class="form-input" placeholder="John Doe" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="form-input" placeholder="name@company.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-input" placeholder="At least 8 characters" required />
                </div>

                <div class="form-group" style="margin-bottom: 1.75rem;">
                    <label class="form-label" for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" class="form-input" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn btn-primary" id="btnRegisterSubmit" style="width: 100%; height: 42px;">
                    Register
                </button>
            </form>

            <div style="display: flex; align-items: center; margin: 1.25rem 0; color: var(--color-text-tertiary); font-size: 0.8rem;">
                <div style="flex: 1; height: 1px; background: var(--color-border, #e5e7eb);"></div>
                <span style="padding: 0 0.75rem; font-weight: 500;">ATAU</span>
                <div style="flex: 1; height: 1px; background: var(--color-border, #e5e7eb);"></div>
            </div>

            <div id="googleBtnContainer" style="display: flex; justify-content: center; min-height: 40px; margin-bottom: 0.5rem;"></div>

            <div class="auth-footer">
                Already have an account? <a href="login.html" class="auth-link">Log in here</a>
            </div>

        </div>
    </div>

    <!-- Script handlers -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module">
        import { authService } from './js/services/authService.js';

        window.handleGoogleCredentialResponse = async (response) => {
            if (!response.credential) return;
            showAlert('Verifying Google Login...', 'success');
            try {
                const res = await authService.loginWithGoogle(response.credential, true);
                if (res && res.token) {
                    showAlert('Google Authentication Successful! Redirecting...', 'success');
                    setTimeout(() => window.location.replace('dashboard.html'), 500);
                } else {
                    showAlert(res.message || 'Google Registration failed', 'error');
                }
            } catch (err) {
                showAlert(err.message || 'Google Authentication failed', 'error');
            }
        };

        // Initialize Google Auth
        (async () => {
            const clientId = await authService.getGoogleClientId();
            if (clientId && window.google?.accounts?.id) {
                google.accounts.id.initialize({
                    client_id: clientId,
                    callback: window.handleGoogleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById('googleBtnContainer'),
                    { theme: 'outline', size: 'large', width: 300, text: 'signup_with' }
                );
            }
        })();

        const alertBox = document.getElementById('authAlertBox');

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const btnSubmit = document.getElementById('btnRegisterSubmit');

            // Input Validation checks
            if (!name || !email || !password || !confirmPassword) {
                showAlert('Please fill in all required fields.', 'error');
                return;
            }

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters long.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match. Please verify.', 'error');
                return;
            }

            // Trigger Loading state
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<span style="display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; vertical-align: middle;"></span>Registering...`;
            alertBox.style.display = 'none';

            try {
                const response = await authService.register(name, email, password);
                if (response && response.success) {
                    showAlert('Success! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.replace('login.html?registered=true');
                    }, 1000);
                } else {
                    showAlert(response.message || 'Registration failed. Try again.', 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = 'Register';
                }
            } catch (err) {
                showAlert(err.message || 'Connection server error. Please try again.', 'error');
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Register';
            }
        });

        function showAlert(msg, type) {
            alertBox.innerText = msg;
            alertBox.className = `auth-alert ${type}`;
            alertBox.style.display = 'block';
        }
    </script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
