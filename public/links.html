<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Cloaker & Shortener | SocialHub - Platform Scheduler</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Manage and shorten affiliate links using custom domains and bypass social unfurl previews.">
    <meta name="author" content="SocialHub Team">

    <!-- Auth Route Guard: redirects to login.html instantly if user not authenticated -->
    <script type="module">
        import { sessionService } from './js/services/sessionService.js';
        sessionService.requireAuth();
    </script>

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        .links-container-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            width: 100%;
        }

        .links-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .links-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--color-text-primary);
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 0.75rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .links-list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--color-bg-accent);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            gap: 1rem;
            transition: all var(--transition-fast) ease;
        }

        .link-item-row:hover {
            border-color: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .link-meta-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .short-url-link {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .short-url-link:hover {
            text-decoration: underline;
        }

        .original-url-text {
            font-size: 0.75rem;
            color: var(--color-text-tertiary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }

        .preview-details-badge {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            background: var(--color-bg-secondary);
            padding: 0.15rem 0.4rem;
            border-radius: var(--radius-xs);
            display: inline-block;
            max-width: max-content;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-stats-col {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .clicks-badge {
            background: rgba(59, 130, 246, 0.1);
            color: var(--color-primary);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .actions-col {
            display: flex;
            gap: 0.5rem;
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            background: var(--color-bg-card);
            border: 1.5px dashed var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            box-sizing: border-box;
        }

        .toast-notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--color-success);
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            font-size: 0.875rem;
            font-weight: 500;
            animation: slideUp var(--transition-normal) forwards;
            display: none;
            z-index: 1500;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 992px) {
            .links-container-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <app-sidebar></app-sidebar>
        <app-header></app-header>
        <app-bottom-nav></app-bottom-nav>

        <main class="main-content animated-fade-in">
            
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-section">
                    <h1 class="page-title">Link Cloaker & Shortener</h1>
                    <p class="page-subtitle">Generate neutral link bridge redirects to bypass social preview cards and hide prices.</p>
                </div>
            </div>

            <!-- Main Layout Grid -->
            <div class="links-container-layout">
                
                <!-- Left: Create link form -->
                <div class="links-card">
                    <h2 class="links-card-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Create Short Link
                    </h2>
                    
                    <form id="createLinkForm" style="display: flex; flex-direction: column; gap: 1.25rem;">
                        <div>
                            <label class="form-label" for="targetUrl" style="font-weight:600;">Destination URL (Shopee/Lazada Link) *</label>
                            <input type="url" id="targetUrl" class="form-input" placeholder="e.g. https://s.shopee.com.my/..." required style="width:100%;">
                        </div>

                        <div>
                            <label class="form-label" for="customAlias" style="font-weight:600;">Custom Alias / Path (Optional)</label>
                            <div style="display: flex; align-items: center; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg-secondary); overflow: hidden;">
                                <span style="font-size: 0.85rem; color: var(--color-text-tertiary); padding: 0.5rem 0.75rem; border-right: 1px solid var(--color-border); background: var(--color-bg-accent);">nakcuba.my/l/</span>
                                <input type="text" id="customAlias" class="form-input" placeholder="e.g. serbuk-viral" style="flex: 1; border: none; border-radius: 0; outline: none; box-shadow: none; padding: 0.5rem 0.75rem; background: transparent; font-size: 0.85rem;">
                            </div>
                            <span style="font-size: 0.7rem; color: var(--color-text-tertiary); margin-top: 0.25rem; display: block;">Letters, numbers, hyphens & underscores only.</span>
                        </div>

                        <div>
                            <label class="form-label" for="previewTitle" style="font-weight:600;">Custom Preview Title (Optional)</label>
                            <input type="text" id="previewTitle" class="form-input" placeholder="e.g. Lihat ulasan barang viral ni" style="width:100%;">
                        </div>

                        <div>
                            <label class="form-label" for="previewDesc" style="font-weight:600;">Custom Preview Description (Optional)</label>
                            <textarea id="previewDesc" class="form-input" rows="2" placeholder="e.g. Klik pautan untuk lihat butiran dan diskaun menarik..." style="width:100%; resize:vertical; height:auto; min-height:60px;"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem;">
                            Generate Short Link
                        </button>
                    </form>
                </div>

                <!-- Right: Active links list -->
                <div class="links-card">
                    <h2 class="links-card-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                        </svg>
                        Your Shortened Links
                    </h2>
                    
                    <div class="links-list-wrapper" id="linksListContainer">
                        <!-- Loading spinner -->
                        <div class="empty-state" id="linksLoading">
                            <span style="display: inline-block; width: 24px; height: 24px; border: 3px solid var(--color-primary); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 0.5rem;"></span>
                            <p>Retrieving shortened links...</p>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Toast Notification Widget -->
    <div id="toastNotification" class="toast-notification">Pautan berjaya dijana!</div>

    <!-- Page Logic Integration -->
    <script type="module">
        import { apiClient } from './js/utils/api.js';

        const createLinkForm = document.getElementById('createLinkForm');
        const targetUrlInput = document.getElementById('targetUrl');
        const customAliasInput = document.getElementById('customAlias');
        const previewTitleInput = document.getElementById('previewTitle');
        const previewDescInput = document.getElementById('previewDesc');
        const linksListContainer = document.getElementById('linksListContainer');
        const toastNotification = document.getElementById('toastNotification');

        // Load all active shortened links
        async function fetchLinks() {
            try {
                const data = await apiClient.get('/links');
                if (data && data.success) {
                    renderLinks(data.links);
                } else {
                    showErrorState();
                }
            } catch (err) {
                console.error("Failed to load links:", err);
                showErrorState();
            }
        }

        function renderLinks(links) {
            linksListContainer.innerHTML = '';
            
            if (links.length === 0) {
                linksListContainer.innerHTML = `
                    <div class="empty-state">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-text-tertiary);">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                        </svg>
                        <p style="font-weight: 600; margin: 0.5rem 0 0 0; color: var(--color-text-secondary);">No links shortened yet</p>
                        <p style="font-size: 0.8rem; margin: 0; color: var(--color-text-tertiary);">Enter a Shopee link on the left to hide its price previews.</p>
                    </div>
                `;
                return;
            }

            links.forEach(link => {
                const shortUrl = `https://nakcuba.my/l/${link.code}`;
                const row = document.createElement('div');
                row.className = 'link-item-row';
                row.innerHTML = `
                    <div class="link-meta-info">
                        <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                            <a href="${shortUrl}" target="_blank" class="short-url-link">${shortUrl}</a>
                            <span class="preview-details-badge" title="${link.title || 'Lihat produk viral terkini'}">${link.title || 'Neutral Preview'}</span>
                        </div>
                        <span class="original-url-text" title="${link.target_url}">Destination: ${link.target_url}</span>
                    </div>
                    
                    <div class="link-stats-col">
                        <div class="clicks-badge" title="Total clicks">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <span>${link.clicks_count}</span>
                        </div>
                        
                        <div class="actions-col">
                            <button class="btn btn-secondary copy-btn" data-url="${shortUrl}" style="padding: 0.4rem 0.5rem; cursor: pointer; display: flex; align-items: center;" title="Copy to clipboard">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                            <button class="btn btn-danger delete-btn" data-id="${link.id}" style="padding: 0.4rem 0.5rem; cursor: pointer; display: flex; align-items: center;" title="Delete link">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;

                // Copy listener
                row.querySelector('.copy-btn').addEventListener('click', (e) => {
                    const btn = e.currentTarget;
                    const url = btn.dataset.url;
                    navigator.clipboard.writeText(url).then(() => {
                        showToast("Pautan disalin ke clipboard!");
                        
                        // Temporary success feedback on icon
                        const originalHtml = btn.innerHTML;
                        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                        setTimeout(() => btn.innerHTML = originalHtml, 2000);
                    });
                });

                // Delete listener
                row.querySelector('.delete-btn').addEventListener('click', async (e) => {
                    const id = e.currentTarget.dataset.id;
                    if (confirm("Adakah anda pasti mahu memadam pautan cloaker ini?")) {
                        try {
                            const res = await apiClient.delete(`/links/${id}`);
                            if (res && res.success) {
                                showToast("Pautan berjaya dipadam!");
                                fetchLinks();
                            }
                        } catch (err) {
                            showToast("Ralat memadam pautan!");
                        }
                    }
                });

                linksListContainer.appendChild(row);
            });
        }

        function showErrorState() {
            linksListContainer.innerHTML = `
                <div class="empty-state" style="border-color: var(--color-danger-light);">
                    <p style="color: var(--color-danger); font-weight:600; margin:0;">Ralat memuat turun data pautan.</p>
                    <p style="font-size:0.8rem; margin:0; color: var(--color-text-tertiary);">Sila cuba sebentar lagi.</p>
                </div>
            `;
        }

        function showToast(message, isError = false) {
            toastNotification.textContent = message;
            toastNotification.style.background = isError ? 'var(--color-danger)' : 'var(--color-success)';
            toastNotification.style.display = 'block';
            setTimeout(() => {
                toastNotification.style.display = 'none';
            }, 3000);
        }

        // Form Submit Handler
        createLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const target_url = targetUrlInput.value.trim();
            const code = customAliasInput.value.trim();
            const title = previewTitleInput.value.trim();
            const description = previewDescInput.value.trim();

            if (!target_url) return;

            try {
                const res = await apiClient.post('/links', {
                    target_url,
                    code: code || undefined,
                    title: title || undefined,
                    description: description || undefined
                });

                if (res && res.success) {
                    showToast("Pautan cloaker berjaya dijana!");
                    createLinkForm.reset();
                    fetchLinks();
                }
            } catch (err) {
                showToast(err.message || "Ralat menjana pautan!", true);
            }
        });

        // Initialize Page
        fetchLinks();
    </script>

    <!-- Custom elements registration -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
