<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedules Calendar | SocialHub - Scheduling Platform</title>

    <!-- Auth Route Guard: redirects to login.html instantly if user not authenticated -->
    <script type="module">
        import { sessionService } from './js/services/sessionService.js';
        sessionService.requireAuth();
    </script>

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .calendar-workspace {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .calendar-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-bg-card);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
        }

        .calendar-nav-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .calendar-view-toggle {
            display: flex;
            background: var(--color-bg-accent);
            border-radius: var(--radius-xs);
            padding: 0.25rem;
        }

        .calendar-view-btn {
            background: none;
            border: none;
            padding: 0.45rem 1rem;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            cursor: pointer;
            border-radius: var(--radius-xs);
            transition: all var(--transition-fast);
        }

        .calendar-view-btn.active {
            background: var(--color-bg-card);
            color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }

        /* Monthly grid styles */
        .calendar-grid-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--color-text-tertiary);
            padding-bottom: 0.5rem;
        }

        .calendar-grid-body {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 110px;
            gap: 1px;
            background: var(--color-border);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .calendar-cell {
            background: var(--color-bg-card);
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            transition: background var(--transition-fast);
        }

        .calendar-cell:hover {
            background: var(--color-bg-accent);
        }

        .calendar-cell.different-month {
            background: var(--color-bg-base);
            opacity: 0.5;
        }

        .cell-day-num {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            align-self: flex-end;
        }

        .cell-schedules-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 0.25rem;
            padding-right: 2px;
        }

        /* Tiny schedule card */
        .tiny-schedule-badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.35rem;
            border-radius: var(--radius-xs);
            border: 1px solid rgba(0,0,0,0.05);
            background: var(--color-primary-light);
            color: var(--color-primary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            transition: transform 0.1s ease;
        }

        .tiny-schedule-badge:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-sm);
        }

        .tiny-schedule-badge.threads {
            background: rgba(0,0,0,0.04);
            color: #000000;
            border-color: rgba(0,0,0,0.1);
        }

        .tiny-schedule-badge.published {
            background: var(--color-success-light);
            color: var(--color-success);
        }

        .tiny-schedule-badge.failed {
            background: var(--color-danger-light);
            color: var(--color-danger);
        }

        /* Popups and details drawers */
        .picker-modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1001;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .picker-modal-content {
            width: 90%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.5rem;
        }

        .meta-detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8125rem;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 0.35rem;
            margin-bottom: 0.35rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <app-sidebar></app-sidebar>
        <app-header></app-header>

        <main class="main-content animated-fade-in">
            
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-section">
                    <h1 class="page-title">Schedules Calendar</h1>
                    <p class="page-subtitle">Visual month calendar overview of queued and published postings.</p>
                </div>
            </div>

            <!-- Workspace -->
            <div class="calendar-workspace">
                
                <!-- Navigation controls bar -->
                <div class="calendar-nav-bar">
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <button class="btn btn-secondary" style="padding: 0.45rem 0.75rem;" id="btnPrevMonth">◀</button>
                        <span class="calendar-nav-title" id="calendarTitle">June 2026</span>
                        <button class="btn btn-secondary" style="padding: 0.45rem 0.75rem;" id="btnNextMonth">▶</button>
                        <button class="btn btn-secondary" style="padding: 0.45rem 0.75rem; margin-left: 0.5rem;" id="btnToday">Today</button>
                    </div>

                    <div class="calendar-view-toggle">
                        <button class="calendar-view-btn active" data-view="month">Month</button>
                        <button class="calendar-view-btn" data-view="week" disabled title="Upcoming release">Week</button>
                        <button class="calendar-view-btn" data-view="day" disabled title="Upcoming release">Day</button>
                    </div>
                </div>

                <!-- Monthly grid block -->
                <div>
                    <!-- Weekday headers -->
                    <div class="calendar-grid-header">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    
                    <!-- Month Cells Body -->
                    <div class="calendar-grid-body" id="calendarGrid">
                        <!-- Cells generated dynamically -->
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Schedule Details Modal Popup Dialog -->
    <div class="picker-modal-backdrop" id="scheduleDetailModal">
        <div class="card picker-modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); padding-bottom: 0.75rem;">
                <h3 class="card-title" style="margin-bottom: 0;">Schedule Details</h3>
                <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" id="btnCloseModal">Close</button>
            </div>
            
            <div id="modalDetailsContent">
                <!-- Details list items -->
            </div>

            <!-- Reschedule Zone -->
            <div id="rescheduleForm" style="display: none; border-top: 1px dashed var(--color-border); padding-top: 1rem; margin-top: 0.5rem;">
                <div class="form-group">
                    <label class="form-label" for="rescheduleTimeInput">Choose New Date & Time</label>
                    <input type="datetime-local" id="rescheduleTimeInput" class="form-input" />
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="btnSubmitReschedule">
                    Update Scheduled Time
                </button>
            </div>

            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                <button class="btn btn-secondary" style="flex: 1; font-size: 0.8125rem;" id="btnShowReschedule">Reschedule</button>
                <button class="btn btn-danger" style="flex: 1; font-size: 0.8125rem;" id="btnCancelSchedule">Cancel Schedule</button>
            </div>
        </div>
    </div>

    <!-- Script imports -->
    <script type="module" src="js/app.js"></script>
    <script type="module">
        import { scheduleService } from './js/services/scheduleService.js';
        import { calendarService } from './js/services/calendarService.js';
        import { timezoneService } from './js/services/timezoneService.js';

        let currentYear = 2026;
        let currentMonth = 5; // 0-indexed: June = 5
        let schedulesList = [];
        let selectedSchedule = null;

        const grid = document.getElementById('calendarGrid');
        const title = document.getElementById('calendarTitle');
        const detailModal = document.getElementById('scheduleDetailModal');
        const modalContent = document.getElementById('modalDetailsContent');
        
        const rescheduleForm = document.getElementById('rescheduleForm');
        const rescheduleInput = document.getElementById('rescheduleTimeInput');

        const monthNames = [
            "January", "February", "March", "April", "May", "June", 
            "July", "August", "September", "October", "November", "December"
        ];

        async function fetchSchedules() {
            schedulesList = await scheduleService.getSchedules();
            buildCalendarGrid();
        }

        function buildCalendarGrid() {
            title.textContent = `${monthNames[currentMonth]} ${currentYear}`;
            grid.innerHTML = '';

            const dayGrid = calendarService.getMonthGridDays(currentYear, currentMonth);
            const grouped = calendarService.groupSchedulesByDate(schedulesList);

            dayGrid.forEach(cell => {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'calendar-cell';
                if (!cell.isCurrentMonth) {
                    cellDiv.classList.add('different-month');
                }

                // Append Day Num
                const dayNumSpan = document.createElement('span');
                dayNumSpan.className = 'cell-day-num';
                dayNumSpan.textContent = cell.date.getDate();
                cellDiv.appendChild(dayNumSpan);

                // Append Schedules
                const container = document.createElement('div');
                container.className = 'cell-schedules-container';
                
                const yyyy = cell.date.getFullYear();
                const mm = String(cell.date.getMonth() + 1).padStart(2, '0');
                const dd = String(cell.date.getDate()).padStart(2, '0');
                const dateKey = `${yyyy}-${mm}-${dd}`;

                const daySchedules = grouped[dateKey] || [];
                daySchedules.forEach(item => {
                    const badge = document.createElement('div');
                    badge.className = `tiny-schedule-badge ${item.platform} ${item.status}`;
                    
                    const timeLabel = new Date(item.scheduled_at).toLocaleTimeString(undefined, { 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        hour12: false 
                    });

                    badge.innerHTML = `<span>[${item.platform[0].toUpperCase()}]</span> <span>${timeLabel}</span>`;
                    badge.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openDetailsModal(item);
                    });
                    container.appendChild(badge);
                });

                cellDiv.appendChild(container);
                grid.appendChild(cellDiv);
            });
        }

        function openDetailsModal(item) {
            selectedSchedule = item;
            rescheduleForm.style.display = 'none';

            const localTimeStr = timezoneService.formatUtcToLocal(item.scheduled_at);
            const statusBadgeMap = {
                queued: '<span class="badge badge-info">queued</span>',
                publishing: '<span class="badge badge-warning">publishing</span>',
                published: '<span class="badge badge-success">published</span>',
                failed: '<span class="badge badge-danger">failed</span>',
                cancelled: '<span class="badge">cancelled</span>',
                retrying: '<span class="badge badge-warning">retrying</span>'
            };

            const badge = statusBadgeMap[item.status] || '<span class="badge">unknown</span>';
            const displayTitle = item.title || 'Untitled Scheduled Draft';
            const displayCaption = item.caption || '(No caption provided)';

            modalContent.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    <h4 style="font-size: 0.9375rem; font-weight:600; color:var(--color-text-primary);">${displayTitle}</h4>
                    <p style="font-size:0.8125rem; color:var(--color-text-secondary); margin-top:0.25rem;">"${displayCaption}"</p>
                </div>
                
                <div class="meta-detail-row">
                    <span>Platform Target:</span>
                    <span style="font-weight:600; text-transform:capitalize;">${item.platform}</span>
                </div>
                <div class="meta-detail-row">
                    <span>Scheduled Time:</span>
                    <span style="font-weight:500;">${localTimeStr}</span>
                </div>
                <div class="meta-detail-row">
                    <span>Target Timezone:</span>
                    <span>${item.timezone}</span>
                </div>
                <div class="meta-detail-row">
                    <span>Attempt Count:</span>
                    <span>${item.attempt_count} / 3</span>
                </div>
                <div class="meta-detail-row">
                    <span>Publish Status:</span>
                    <span>${badge}</span>
                </div>
            `;

            detailModal.style.display = 'flex';
        }

        // Cancel schedule
        document.getElementById('btnCancelSchedule').addEventListener('click', async () => {
            if (selectedSchedule && confirm("Are you sure you want to cancel this scheduled posting?")) {
                const success = await scheduleService.cancelSchedule(selectedSchedule.id);
                if (success) {
                    detailModal.style.display = 'none';
                    fetchSchedules();
                }
            }
        });

        // Reschedule toggler
        document.getElementById('btnShowReschedule').addEventListener('click', () => {
            rescheduleForm.style.display = 'block';
            // Set current time as input default value in local format
            rescheduleInput.value = timezoneService.utcToLocalInputFormat(selectedSchedule.scheduled_at);
        });

        // Submit reschedule
        document.getElementById('btnSubmitReschedule').addEventListener('click', async () => {
            const localVal = rescheduleInput.value;
            if (!localVal) return;

            const utcVal = timezoneService.localToUtc(localVal);
            const userTimezone = timezoneService.getUserTimezone();

            const success = await scheduleService.updateSchedule(selectedSchedule.id, {
                scheduled_at: utcVal,
                timezone: userTimezone,
                status: 'queued' // reset to queued state
            });

            if (success) {
                detailModal.style.display = 'none';
                fetchSchedules();
            }
        });

        // Navigation listeners
        document.getElementById('btnPrevMonth').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            buildCalendarGrid();
        });

        document.getElementById('btnNextMonth').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            buildCalendarGrid();
        });

        document.getElementById('btnToday').addEventListener('click', () => {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            buildCalendarGrid();
        });

        document.getElementById('btnCloseModal').addEventListener('click', () => {
            detailModal.style.display = 'none';
        });

        // Run
        fetchSchedules();
    </script>
</body>
</html>
