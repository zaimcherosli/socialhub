# wrangler.toml - Cloudflare Worker Configuration
name = "socialhub-api"
main = "src/index.js"
compatibility_date = "2026-06-29"

# Variables/Bindings
[vars]
ENVIRONMENT = "development"
THREADS_CLIENT_ID = "952901221088471"
FRONTEND_ORIGIN = "https://socialhub.zaimrosli.my"
OPENROUTER_MODEL = "meta-llama/llama-3.2-3b-instruct:free"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "socialhub-db"
database_id = "f8054d30-59c2-4cdd-820c-ffe8eed91bf9"

[triggers]
crons = ["* * * * *"]


