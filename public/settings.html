<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SocialHub - Platform Scheduler</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Configure API tokens, user authentication profiles, scheduler intervals, and system parameters in SocialHub.">
    <meta name="author" content="SocialHub Team">

    <!-- Auth Route Guard: redirects to login.html instantly if user not authenticated -->
    <script type="module">
        import { sessionService } from './js/services/sessionService.js';
        sessionService.requireAuth();
    </script>

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <div class="app-container">
        <app-sidebar></app-sidebar>
        <app-header></app-header>

        <main class="main-content animated-fade-in">
            
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-section">
                    <h1 class="page-title">Settings</h1>
                    <p class="page-subtitle">Configure your profile, API channels, and publishing parameters.</p>
                </div>
            </div>

            <!-- Double-column configurations layout -->
            <div class="two-col-grid">
                
                <!-- Left: User Profile Config Form -->
                <div class="card" style="padding: 1.75rem;">
                    <h3 class="card-title" style="margin-bottom: 1.25rem;">User Profile</h3>
                    
                    <form id="profileSettingsForm" onsubmit="event.preventDefault(); alert('Profile changes saved!');">
                        <div class="form-group">
                            <label class="form-label" for="profileName">Full Name</label>
                            <input type="text" id="profileName" class="form-input" value="John Doe" />
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="profileEmail">Email Address</label>
                            <input type="email" id="profileEmail" class="form-input" value="john.doe@socialhub.so" disabled />
                        </div>

                        <div class="form-group" style="margin-top: 1.5rem;">
                            <button type="submit" class="btn btn-primary">Save Profile</button>
                        </div>
                    </form>
                </div>

                <!-- Right: Cloudflare Workers & Pipeline Keys -->
                <div class="card" style="padding: 1.75rem;">
                    <h3 class="card-title" style="margin-bottom: 1.25rem;">Backend Configuration</h3>
                    
                    <form id="pipelineSettingsForm" onsubmit="event.preventDefault(); alert('Backend configuration updated!');">
                        <div class="form-group">
                            <label class="form-label" for="workerUrl">Cloudflare Worker API Endpoint</label>
                            <input type="url" id="workerUrl" class="form-input" value="https://socialhub-api-worker.zaim.workers.dev" />
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="apiKey">Worker Secret Key (Auth Bearer Token)</label>
                            <input type="password" id="apiKey" class="form-input" value="••••••••••••••••••••••••••••••••" />
                        </div>

                        <div class="form-group" style="margin-top: 1.5rem;">
                            <button type="submit" class="btn btn-primary">Save API Tokens</button>
                        </div>
                    </form>
                </div>

            </div>

        </main>
    </div>

    <!-- ES Module Javascript Boilerplate -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
