<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant | SocialHub - Urus Kempen & Copywriting</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Sembang dengan SocialHub AI Agent untuk merangka caption, merancang strategi pemasaran, dan menjadualkan post secara automatik.">
    <meta name="author" content="SocialHub Team">

    <!-- Auth Route Guard -->
    <script type="module">
        import { sessionService } from './js/services/sessionService.js';
        sessionService.requireAuth();
    </script>

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        @media (max-width: 768px) {
            body {
                overflow: hidden !important;
            }
            /* Hide page title on mobile — chat takes full screen like WhatsApp */
            .page-header {
                display: none !important;
            }
            /* Main content: pinned between header and bottom nav using fixed positioning */
            .main-content {
                padding: 0 !important;
                margin: 0 !important;
                position: fixed !important;
                top: 58px !important;
                bottom: 64px !important;
                left: 0 !important;
                right: 0 !important;
                height: auto !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
            }
            /* Chat container fills the pinned main content area */
            .chat-container {
                position: absolute !important;
                top: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                height: auto !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                display: flex !important;
                flex-direction: column !important;
                overflow: hidden !important;
            }
            .chat-messages {
                flex: 1 1 0% !important;
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch !important;
                min-height: 0 !important;
            }
            /* Templates bar compact on mobile */
            .quick-templates-bar {
                padding: 0.35rem 0.75rem !important;
                flex-shrink: 0 !important;
            }
            /* Input area: always pinned at bottom, never hidden */
            .chat-input-area {
                flex-shrink: 0 !important;
                padding-bottom: max(0.5rem, env(safe-area-inset-bottom)) !important;
            }
        }

        .chat-header {
            display: flex;
            align-items: center;
            padding: 1rem 1.25rem;
            background: var(--color-bg-accent);
            border-bottom: 1px solid var(--color-border);
            gap: 0.75rem;
        }

        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            position: relative;
            animation: pulseAvatar 2s infinite ease-in-out;
        }

        @keyframes pulseAvatar {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .agent-info {
            display: flex;
            flex-direction: column;
        }

        .agent-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--color-text-primary);
        }

        .agent-status {
            font-size: 0.72rem;
            color: var(--color-success, #22c55e);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
            display: inline-block;
            animation: blinkStatus 1.5s infinite alternate;
        }

        @keyframes blinkStatus {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .chat-messages {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--color-bg-primary);
        }

        .message-bubble {
            max-width: 75%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            line-height: 1.5;
            word-break: break-word;
            animation: slideBubble 0.25s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideBubble {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-user {
            align-self: flex-end;
            background: var(--color-primary);
            color: white;
            border-bottom-right-radius: 3px;
        }

        .message-agent {
            align-self: flex-start;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            color: var(--color-text-primary);
            border-bottom-left-radius: 3px;
            box-shadow: var(--shadow-sm);
        }

        .message-time {
            font-size: 0.68rem;
            color: var(--color-text-tertiary);
            margin-top: 0.35rem;
            display: block;
            text-align: right;
        }

        .message-user .message-time {
            color: rgba(255, 255, 255, 0.75);
        }

        .chat-input-area {
            padding: 1rem 1.25rem;
            background: var(--color-bg-accent);
            border-top: 1px solid var(--color-border);
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            transition: border var(--transition-fast), box-shadow var(--transition-fast);
            resize: none;
            height: 44px;
            box-sizing: border-box;
            line-height: 1.4;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-send {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: var(--color-primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background var(--transition-fast), transform var(--transition-fast);
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: var(--color-primary-dark);
            transform: scale(1.02);
        }

        .btn-send:disabled {
            background: var(--color-border);
            cursor: not-allowed;
            transform: none;
        }

        /* Bouncing Dots Animation */
        .typing-dots {
            display: flex;
            gap: 0.25rem;
            align-items: center;
            padding: 0.35rem 0.5rem;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--color-text-secondary);
            border-radius: 50%;
            animation: bounceDot 1.4s infinite both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .empty-chat-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--color-text-secondary);
            text-align: center;
            padding: 2rem;
            gap: 1rem;
        }

        .suggestion-chip {
            background: var(--color-bg-accent);
            border: 1px solid var(--color-border);
            padding: 0.5rem 0.85rem;
            border-radius: var(--radius-md);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-block;
            margin: 0.25rem;
            text-align: left;
        }

        .suggestion-chip:hover {
            background: var(--color-primary-light);
            border-color: var(--color-primary);
            color: var(--color-primary-dark);
        }
        
        .quick-template-btn {
            background: var(--color-bg-card, #ffffff);
            border: 1px solid var(--color-border, #e2e8f0);
            border-radius: var(--radius-sm, 6px);
            padding: 0.35rem 0.65rem;
            font-size: 0.725rem;
            font-weight: 600;
            color: var(--color-text-secondary, #64748b);
            cursor: pointer;
            transition: all var(--transition-fast, 0.15s ease);
            flex-shrink: 0;
        }
        .quick-template-btn:hover {
            border-color: var(--color-primary, #6366f1);
            color: var(--color-primary, #6366f1);
            background: var(--color-primary-light, rgba(99, 102, 241, 0.05));
        }
        
        .voice-btn.listening {
            color: #ef4444 !important;
            animation: pulseMic 1.5s infinite ease-in-out;
        }
        @keyframes pulseMic {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Reusable Custom Sidebar Element -->
        <app-sidebar></app-sidebar>

        <!-- Reusable Custom Header Element -->
        <app-header></app-header>

        <!-- Reusable Custom Bottom Navigation Element -->
        <app-bottom-nav></app-bottom-nav>

        <!-- Main Content Area -->
        <main class="main-content animated-fade-in">
            
            <div class="page-header" style="margin-bottom: 1.25rem;">
                <div class="page-title-section">
                    <h1 class="page-title">AI Marketing Assistant</h1>
                    <p class="page-subtitle">Sembang dengan AI Agent anda untuk merangka draf, mengolah kempen, dan menjadualkan penerbitan.</p>
                </div>
            </div>

            <!-- Chat Window -->
            <div class="chat-container">
                
                <!-- Header -->
                <div class="chat-header">
                    <div class="agent-avatar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a10 10 0 0 1 7.54 16.59c-.43.5-.82 1-1.12 1.57a3 3 0 0 0-.4 1.84V22h-12v-2a3 3 0 0 0-.4-1.84c-.3-.57-.69-1.07-1.12-1.57A10 10 0 0 1 12 2Z"/>
                            <path d="M8 12h8"/>
                            <path d="M9 16h6"/>
                        </svg>
                    </div>
                    <div class="agent-info">
                        <span class="agent-name">SocialHub AI Agent</span>
                        <span class="agent-status"><span class="status-dot"></span>Aktif & Sedia Membantu</span>
                    </div>
                </div>

                <!-- Messages Container -->
                <div class="chat-messages" id="chatMessages">
                    <!-- Loaded dynamically -->
                </div>

                <!-- Quick Templates Bar -->
                <div class="quick-templates-bar" style="display: flex; gap: 0.5rem; padding: 0.5rem 1.25rem; background: var(--color-bg-secondary); border-top: 1px solid var(--color-border); overflow-x: auto; white-space: nowrap; align-items: center;">
                    <span style="font-size: 0.7rem; font-weight: bold; color: var(--color-text-secondary); margin-right: 0.25rem;">Pintas:</span>
                    <button class="quick-template-btn" data-template="Ubah draf tadi ke gaya santai / rojak Melayu yang ultra-realistic">✍️ Ulah Rojak</button>
                    <button class="quick-template-btn" data-template="Pecahkan draf post tadi kepada 3 keping Thread storm berantai (Thread Storm)">📑 Buat Utas</button>
                    <button class="quick-template-btn" data-template="Beri 3 variasi hook pembuka berbeza yang lain untuk draf tadi">🪝 Variasi Hook</button>
                    <button class="quick-template-btn" data-template="Tulis semula draf tadi dengan memfokuskan faedah utama produk secara ringkas">💡 Fokus Benefit</button>
                </div>

                <!-- Input Footer -->
                <div class="chat-input-area">
                    <button class="voice-btn" id="btnVoice" title="Dikte Suara (Speech to Text)" style="background: none; border: none; color: var(--color-text-secondary); width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: color 0.2s;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" id="micIcon">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="22"/>
                        </svg>
                    </button>
                    <input type="text" class="chat-input" id="chatInput" placeholder="Tanya sesuatu di sini... (cth: 'Buat draf kondo Ampang RM328k')" maxlength="2000" autocomplete="off" />
                    <button class="btn-send" id="btnSend" aria-label="Send Message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>

            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
    <script type="module">
        import { apiClient } from './js/utils/api.js';
        import { CONFIG } from './js/config/config.js';

        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');

        // Stripping /api from API_BASE_URL to hit direct custom endpoint routes
        const API_BASE = CONFIG.API_BASE_URL.replace(/\/api$/, '');

        // Load chat history on start
        async function loadChatHistory() {
            try {
                const token = localStorage.getItem('socialhub_jwt') || sessionStorage.getItem('socialhub_jwt');
                const response = await fetch(`${API_BASE}/api/ai/chat/history`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                const history = data.history || [];

                if (history.length === 0) {
                    renderEmptyState();
                    return;
                }

                chatMessages.innerHTML = '';
                history.forEach(msg => {
                    appendMessageBubble(msg.sender === 'user' ? 'user' : 'agent', msg.message, msg.created_at);
                });
                scrollToBottom();
            } catch (err) {
                console.error("Failed to load chat history:", err);
                renderEmptyState();
            }
        }

        function renderEmptyState() {
            chatMessages.innerHTML = `
                <div class="empty-chat-state">
                    <div style="font-size: 3rem; margin-bottom: 0.5rem;">🤖</div>
                    <h3 style="font-weight:700; color:var(--color-text-primary); margin:0;">Selamat Datang ke AI Assistant!</h3>
                    <p style="font-size:0.825rem; max-width:320px; margin:0 auto 1.5rem auto;">Saya adalah rakan kongsi pemasaran anda. Tanya apa-apa soalan atau cadangkan idea untuk kempen Threads anda.</p>
                    <div style="max-width: 480px; margin: 0 auto;">
                        <button class="suggestion-chip" data-prompt="Buat draf post Threads pendek untuk perkenalkan ejen hartanah">📝 Draf Post Hartanah</button>
                        <button class="suggestion-chip" data-prompt="Berikan saya 3 idea soalan engagement Threads untuk naikkan komen">💡 Cadangan Engagement</button>
                        <button class="suggestion-chip" data-prompt="Apakah tips copywriting terbaik untuk jual produk affiliate Shopee?">🛍️ Tips Copywriting Affiliate</button>
                    </div>
                </div>
            `;

            // Bind suggestion chips
            document.querySelectorAll('.suggestion-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    chatInput.value = chip.dataset.prompt;
                    chatInput.focus();
                });
            });
        }

        function appendMessageBubble(sender, text, timestamp = null) {
            // Remove empty state if present
            const emptyState = chatMessages.querySelector('.empty-chat-state');
            if (emptyState) emptyState.remove();

            const bubble = document.createElement('div');
            bubble.className = `message-bubble message-${sender}`;
            
            const timeStr = timestamp 
                ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Render text supporting line breaks
            const formattedText = text.replace(/\n/g, '<br>');
            bubble.innerHTML = `
                <div>${formattedText}</div>
                <span class="message-time">${timeStr}</span>
            `;

            // If it's an AI message, append copy and schedule actions
            if (sender === 'agent') {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'agent-message-actions';
                actionsDiv.style.cssText = 'display: flex; gap: 0.5rem; margin-top: 0.65rem; border-top: 1px solid var(--color-border); padding-top: 0.5rem;';
                
                const btnCopy = document.createElement('button');
                btnCopy.className = 'action-btn-pill';
                btnCopy.innerHTML = `📋 Salin`;
                btnCopy.style.cssText = 'background:none; border:none; color:var(--color-primary); font-size:0.72rem; font-weight:700; cursor:pointer; padding:0;';
                btnCopy.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigator.clipboard.writeText(text);
                    btnCopy.textContent = '✓ Disalin!';
                    setTimeout(() => btnCopy.innerHTML = '📋 Salin', 2000);
                });

                const btnSchedule = document.createElement('button');
                btnSchedule.className = 'action-btn-pill';
                btnSchedule.innerHTML = `📅 Jadual & Edit`;
                btnSchedule.style.cssText = 'background:none; border:none; color:var(--color-primary); font-size:0.72rem; font-weight:700; cursor:pointer; padding:0; margin-left: 0.75rem;';
                btnSchedule.addEventListener('click', (e) => {
                    e.stopPropagation();
                    let cleanText = text.replace(/---thread-separator---/g, '\n\n').trim();
                    window.location.href = `post-editor.html?caption=${encodeURIComponent(cleanText)}`;
                });

                actionsDiv.appendChild(btnCopy);
                actionsDiv.appendChild(btnSchedule);
                bubble.appendChild(actionsDiv);
            }

            chatMessages.appendChild(bubble);
            scrollToBottom();
        }

        function appendTypingIndicator() {
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble message-agent';
            bubble.id = 'typingIndicator';
            bubble.innerHTML = `
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatMessages.appendChild(bubble);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Clear input and append user bubble
            chatInput.value = '';
            appendMessageBubble('user', text);
            
            // Disable inputs
            chatInput.disabled = true;
            btnSend.disabled = true;

            // Append typing animation
            appendTypingIndicator();

            try {
                const token = localStorage.getItem('socialhub_jwt') || sessionStorage.getItem('socialhub_jwt');
                const response = await fetch(`${API_BASE}/api/ai/chat/send`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                removeTypingIndicator();
                appendMessageBubble('agent', data.message || 'Maaf, model tidak memberikan sebarang tindak balas.');
            } catch (err) {
                console.error("Chat request failed:", err);
                removeTypingIndicator();
                appendMessageBubble('agent', `Ralat sambungan: ${err.message}. Sila cuba sebentar lagi.`);
            } finally {
                chatInput.disabled = false;
                btnSend.disabled = false;
                chatInput.focus();
            }
        }

        // Event Listeners
        btnSend.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Bind Quick Template Buttons
        document.querySelectorAll('.quick-template-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const promptText = btn.dataset.template;
                chatInput.value = promptText;
                sendMessage();
            });
        });

        // Speech-to-Text Voice Dictation Feature
        const btnVoice = document.getElementById('btnVoice');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'ms-MY'; // default to Malay language recognition
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            let isListening = false;

            recognition.onstart = () => {
                isListening = true;
                btnVoice.classList.add('listening');
                chatInput.placeholder = 'Mendengar suara anda...';
            };

            recognition.onend = () => {
                isListening = false;
                btnVoice.classList.remove('listening');
                chatInput.placeholder = 'Tanya sesuatu di sini...';
            };

            recognition.onerror = (e) => {
                console.error('[SpeechRecognition] Error:', e.error);
                isListening = false;
                btnVoice.classList.remove('listening');
                chatInput.placeholder = 'Tanya sesuatu di sini...';
            };

            recognition.onresult = (e) => {
                const resultText = e.results[0][0].transcript;
                if (resultText) {
                    chatInput.value = (chatInput.value + " " + resultText).trim();
                    chatInput.focus();
                }
            };

            btnVoice.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isListening) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });
        } else {
            // Hide mic button if browser does not support Speech Recognition
            btnVoice.style.display = 'none';
        }

        // Visual Viewport Keyboard Resize Helper (WhatsApp/Telegram style)
        // Uses position:fixed on .main-content so only need to adjust bottom offset
        if (window.visualViewport && window.innerWidth <= 768) {
            const mainContent = document.querySelector('.main-content');
            const bottomNav = document.querySelector('app-bottom-nav');
            const BOTTOM_NAV_HEIGHT = 64;

            const handleViewportResize = () => {
                if (window.innerWidth > 768) return;

                const vvHeight = window.visualViewport.height;
                const isKeyboardOpen = (window.innerHeight - vvHeight) > 100;

                if (isKeyboardOpen) {
                    // Keyboard open: expand main content to fill above keyboard
                    // bottom = window.innerHeight - vvHeight (keyboard height)
                    const keyboardHeight = window.innerHeight - vvHeight;
                    if (mainContent) mainContent.style.bottom = `${keyboardHeight}px`;
                    if (bottomNav) bottomNav.style.cssText = 'display:none !important';
                } else {
                    // Keyboard closed: restore bottom nav space
                    if (mainContent) mainContent.style.bottom = `${BOTTOM_NAV_HEIGHT}px`;
                    if (bottomNav) bottomNav.style.cssText = '';
                }

                setTimeout(scrollToBottom, 80);
            };

            window.visualViewport.addEventListener('resize', handleViewportResize);
            chatInput.addEventListener('focus', () => setTimeout(handleViewportResize, 150));
            chatInput.addEventListener('blur', () => setTimeout(handleViewportResize, 150));
        }

        // Initialize
        loadChatHistory();
    </script>
</body>
</html>
