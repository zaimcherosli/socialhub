<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SocialHub - Scheduling Platform</title>
    
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Guest Route Guard: redirects to dashboard instantly if user already authenticated -->
    <script type="module">
        import { sessionService } from './js/services/sessionService.js';
        sessionService.requireGuest();
    </script>

    <style>
        .auth-page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, var(--color-bg-base) 100%);
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            animation: authFadeIn var(--transition-normal) forwards;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-primary);
            letter-spacing: -0.025em;
        }

        .auth-subtitle {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .auth-alert {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-xs);
            font-size: 0.8125rem;
            margin-bottom: 1.25rem;
            font-weight: 500;
        }

        .auth-alert.error {
            background-color: var(--color-danger-light);
            color: var(--color-danger);
            border: 1px solid rgba(220, 53, 69, 0.15);
        }

        .auth-alert.success {
            background-color: var(--color-success-light);
            color: var(--color-success);
            border: 1px solid rgba(40, 167, 69, 0.15);
        }

        .auth-footer {
            margin-top: 1.75rem;
            text-align: center;
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
        }

        .auth-link {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-fast);
        }

        .auth-link:hover {
            color: var(--color-primary-hover);
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="auth-page-wrapper">
        <div class="card auth-card">
            
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#brandGrad)" />
                        <path d="M12 7V17M7 12H17" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                        <defs>
                            <linearGradient id="brandGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3b82f6" />
                                <stop offset="1" stop-color="#1d4ed8" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="auth-title">Reset password</h1>
                <p class="auth-subtitle">Enter your email and we'll send you a recovery link</p>
            </div>

            <!-- Notifications Alerts Box -->
            <div class="auth-alert" id="authAlertBox"></div>

            <!-- Forgot Form -->
            <form id="forgotForm">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label" for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" class="form-input" placeholder="name@company.com" required />
                </div>

                <button type="submit" class="btn btn-primary" id="btnForgotSubmit" style="width: 100%; height: 42px;">
                    Send Recovery Link
                </button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="login.html" class="auth-link">Log in here</a>
            </div>

        </div>
    </div>

    <!-- Script handlers -->
    <script type="module">
        import { authService } from './js/services/authService.js';

        const alertBox = document.getElementById('authAlertBox');

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('forgotEmail').value.trim();
            const btnSubmit = document.getElementById('btnForgotSubmit');

            if (!email) {
                showAlert('Please fill in your email address.', 'error');
                return;
            }

            // Trigger Loading state
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<span style="display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; vertical-align: middle;"></span>Sending...`;
            alertBox.style.display = 'none';

            try {
                const response = await authService.forgotPassword(email);
                if (response && response.success) {
                    showAlert(response.message || 'Recovery email has been dispatched.', 'success');
                    document.getElementById('forgotEmail').value = '';
                } else {
                    showAlert(response.message || 'Request failed. Try again.', 'error');
                }
            } catch (err) {
                showAlert(err.message || 'Connection server error. Please try again.', 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Send Recovery Link';
            }
        });

        function showAlert(msg, type) {
            alertBox.innerText = msg;
            alertBox.className = `auth-alert ${type}`;
            alertBox.style.display = 'block';
        }
    </script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
